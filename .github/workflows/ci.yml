name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Run tests
        run: npm run test
        env:
          SUPABASE_URL: https://ddigjujidraxoptfncma.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_ZJGH_4j7GoDQNFXcTMBAnw_8MTr9Q-X

      - name: Build
        run: npm run build
